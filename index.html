<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Tesla Nav</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0b0c0e" />
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />

<style>
/* ============ Theme ============ */
:root{
  --bg:#0b0c0e; --panel:rgba(18,20,24,0.92); --panel-border:#262a30;
  --accent:#3ea6ff; --green:#37d67a; --amber:#ffb443; --red:#ff5c5c;
  --text:#eef1f4; --text-dim:#8b929c;
  font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;}
button{font-family:inherit; cursor:pointer;}

/* ============ Views ============ */
.view{position:absolute; inset:0; display:none;}
body[data-view="home"] #view-home{display:flex;}
body[data-view="nav"] #view-nav{display:block;}
body[data-view="spotify"] #view-spotify{display:flex;}
body[data-view="both"] #view-both{display:block;}
body[data-view="ndgames"] #view-ndgames{display:flex;}

/* ============ Home screen ============ */
#view-home{flex-direction:column; align-items:center; justify-content:center; gap:28px; background:radial-gradient(circle at 50% 20%, #14171c 0%, #0b0c0e 70%);}
#home-title{font-size:15px; color:var(--text-dim); letter-spacing:0.5px; margin-bottom:-8px;}
#home-grid{display:grid; grid-template-columns:repeat(2, 150px); gap:20px;}
.app-tile{
  width:150px; height:150px; border-radius:26px; background:var(--panel); border:1px solid var(--panel-border);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}
.app-tile:active{transform:scale(0.96);}
.app-tile svg{width:52px; height:52px;}
.app-tile .label{font-size:14px; font-weight:700; color:var(--text);}
.tile-nav{background:linear-gradient(160deg, #17324a, #101b24);}
.tile-spotify{background:linear-gradient(160deg, #123a24, #0e1712);}
.tile-both{background:linear-gradient(160deg, #241a3a, #17121f);}
.tile-ndgames{background:linear-gradient(160deg, #3a1720, #1a1013);}
#home-clock{font-size:44px; font-weight:700; font-variant-numeric:tabular-nums; margin-bottom:6px;}
#home-battery{color:var(--text-dim); font-size:15px; margin-top:-20px;}

/* ---- settings ---- */
#settings-btn{
  position:absolute; top:18px; right:18px; z-index:1000;
  width:44px; height:44px; border-radius:12px;
  background:var(--panel); border:1px solid var(--panel-border); color:var(--text-dim);
  font-size:20px; display:flex; align-items:center; justify-content:center;
}
#settings-overlay{
  position:absolute; inset:0; z-index:1600; background:rgba(0,0,0,0.6);
  display:none; align-items:center; justify-content:center;
}
#settings-overlay.show{display:flex;}
#settings-panel{
  width:320px; background:var(--panel); border:1px solid var(--panel-border); border-radius:18px;
  padding:20px; backdrop-filter:blur(10px);
}
.settings-hdr{display:flex; align-items:center; justify-content:space-between; font-size:16px; font-weight:700; margin-bottom:16px;}
.settings-hdr button{background:rgba(255,255,255,0.06); border:1px solid var(--panel-border); color:var(--text); border-radius:10px; width:32px; height:32px;}
.settings-row-title{font-size:13px; color:var(--text-dim); margin-bottom:8px;}
.theme-opts{display:flex; flex-direction:column; gap:8px;}
.theme-opt{
  background:rgba(255,255,255,0.04); border:1px solid var(--panel-border); color:var(--text);
  border-radius:10px; padding:12px; font-size:14px; font-weight:600; text-align:left;
}
.theme-opt.active{background:var(--accent); border-color:var(--accent); color:#04141f;}
.settings-hint{color:var(--text-dim); font-size:12px; margin-top:12px;}

/* ============ Shared top bar ============ */
.topbar{
  position:absolute; top:0; left:0; right:0; height:64px;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 18px; z-index:1000;
  background:linear-gradient(180deg, rgba(10,11,13,0.9), rgba(10,11,13,0));
  pointer-events:none;
}
.topbar > *{pointer-events:auto;}
.chip{
  display:flex; align-items:center; gap:8px;
  background:var(--panel); border:1px solid var(--panel-border);
  border-radius:14px; padding:8px 14px; font-size:15px; font-weight:600;
  backdrop-filter:blur(6px);
}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--green);}
.battery-chip.low{color:var(--amber);}
.battery-chip.critical{color:var(--red);}
.clock-chip{font-variant-numeric:tabular-nums; color:var(--text-dim); font-weight:600; font-size:15px;}
.home-btn{
  width:40px; height:40px; border-radius:12px; background:var(--panel); border:1px solid var(--panel-border);
  color:var(--text); font-size:18px; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(6px);
}

/* ============ Nav view ============ */
#map, #map2{position:absolute; inset:0; background:#0e0e10;}

.searchwrap{position:absolute; top:78px; left:18px; z-index:1000; display:flex; gap:8px;}
.searchbox{
  flex:1; background:var(--panel); border:1px solid var(--panel-border);
  border-radius:16px; padding:14px 18px; font-size:17px; color:var(--text);
  outline:none; backdrop-filter:blur(6px); width:100%;
}
.searchbox::placeholder{color:var(--text-dim);}
.results{
  position:absolute; top:132px; left:18px; z-index:1000;
  background:var(--panel); border:1px solid var(--panel-border); border-radius:16px;
  max-height:40vh; overflow-y:auto; display:none; backdrop-filter:blur(6px);
}
.result-item{padding:14px 18px; border-bottom:1px solid var(--panel-border); font-size:16px; cursor:pointer;}
.result-item:last-child{border-bottom:none;}
.result-item:active{background:rgba(255,255,255,0.06);}
.result-sub{color:var(--text-dim); font-size:13px; margin-top:2px;}

.routebar{
  position:absolute; left:18px; bottom:18px; z-index:1000;
  background:var(--panel); border:1px solid var(--panel-border);
  border-radius:18px; padding:16px 20px; display:none; backdrop-filter:blur(6px);
  align-items:center; justify-content:space-between; gap:18px;
}
.routebar .big{font-size:26px; font-weight:700;}
.routebar .sub{color:var(--text-dim); font-size:14px; margin-top:2px;}
.routebar button{background:var(--red); color:#fff; border:none; border-radius:12px; padding:12px 18px; font-size:15px; font-weight:600;}
.routebar button.start-btn{background:var(--green); color:#04220f;}

.locate-btn, .traffic-btn{
  position:absolute; right:18px; z-index:1000;
  width:52px; height:52px; border-radius:50%;
  background:var(--panel); border:1px solid var(--panel-border);
  display:flex; align-items:center; justify-content:center; font-size:20px;
  color:var(--text); backdrop-filter:blur(6px);
}
.locate-btn{bottom:18px; color:var(--accent);}
.traffic-btn{bottom:80px;}
.traffic-btn.active{background:var(--accent); color:#04141f;}

/* ============ Spotify (fullscreen) view ============ */
#view-spotify{flex-direction:column; background:var(--bg); padding:78px 18px 18px;}
.sp-now{display:flex; align-items:center; gap:16px; margin-bottom:18px;}
.sp-now .thumb{width:72px; height:72px; border-radius:14px; background:var(--panel); border:1px solid var(--panel-border); overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:28px; color:var(--text-dim); flex-shrink:0;}
.sp-now .thumb img{width:100%; height:100%; object-fit:cover;}
.sp-now .meta{flex:1; min-width:0;}
.sp-now .track{font-size:20px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.sp-now .artist{color:var(--text-dim); font-size:15px; margin-top:2px;}
.sp-controls{display:flex; gap:12px; margin-bottom:20px;}
.sp-controls button{background:var(--panel); border:1px solid var(--panel-border); color:var(--text); width:52px; height:52px; border-radius:50%; font-size:20px;}
.sp-controls button.play{background:var(--green); color:#04220f; border:none; width:60px; height:60px; font-size:24px;}
.sp-grid-title{font-size:14px; color:var(--text-dim); font-weight:700; margin-bottom:10px; letter-spacing:0.3px;}
.sp-grid{flex:1; overflow-y:auto; display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:16px;}
.sp-card{background:var(--panel); border:1px solid var(--panel-border); border-radius:14px; padding:10px; text-align:left;}
.sp-card img{width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:10px; display:block; background:#1a1d21;}
.sp-card .name{margin-top:8px; font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.sp-card .count{color:var(--text-dim); font-size:12px; margin-top:2px;}
.sp-card.playing{border-color:var(--green);}
.sp-device{color:var(--text-dim); font-size:13px; margin-bottom:12px;}

/* ============ Both view (docked player over map) ============ */
#music-dock{
  position:absolute; right:18px; top:78px; z-index:1000;
  width:280px; background:var(--panel); border:1px solid var(--panel-border);
  border-radius:16px; padding:10px 12px; backdrop-filter:blur(10px);
  box-shadow:0 8px 28px rgba(0,0,0,0.35);
}
#music-dock .now-row{display:flex; align-items:center; gap:10px;}
#music-dock .thumb{width:40px; height:40px; border-radius:8px; background:#1a1d21; flex-shrink:0; overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--text-dim);}
#music-dock .thumb img{width:100%; height:100%; object-fit:cover;}
#music-dock .meta{flex:1; min-width:0;}
#music-dock .track{font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
#music-dock .artist{color:var(--text-dim); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
#music-dock .controls{display:flex; gap:6px; margin-top:10px; justify-content:center;}
#music-dock button{background:rgba(255,255,255,0.06); border:1px solid var(--panel-border); color:var(--text); width:34px; height:34px; border-radius:50%; font-size:14px;}
#music-dock button.play{background:var(--accent); color:#04141f; border:none;}
#dock-playlists-btn{width:auto !important; border-radius:10px !important; padding:0 10px !important; font-size:12px; font-weight:600;}

#dock-playlists{
  position:absolute; right:18px; top:222px; z-index:1200;
  width:280px; max-height:min(52vh, 400px);
  background:var(--panel); border:1px solid var(--panel-border);
  border-radius:16px; padding:14px; backdrop-filter:blur(10px);
  box-shadow:0 12px 40px rgba(0,0,0,0.45);
  display:none; flex-direction:column;
}
#dock-playlists.show{display:flex;}
#dock-playlists .hdr{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; font-size:14px; font-weight:700;}
#dock-playlists .close{background:rgba(255,255,255,0.06); border:1px solid var(--panel-border); color:var(--text); border-radius:10px; padding:6px 12px; font-size:12px;}
#dock-pl-list{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px;}
.dock-card{display:flex; align-items:center; gap:10px; text-align:left; background:rgba(255,255,255,0.03); border:1px solid transparent; border-radius:10px; padding:6px;}
.dock-card img{width:38px; height:38px; object-fit:cover; border-radius:8px; background:#1a1d21; flex-shrink:0;}
.dock-card .name{font-size:12px; font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.dock-card.playing{border-color:var(--accent);}

/* ============ ND Games view ============ */
#view-ndgames{flex-direction:column; background:var(--bg);}
#ndgames-frame{flex:1; width:100%; border:none; background:#fff;}
.nd-bar{
  position:absolute; top:0; left:0; right:0; height:64px; z-index:1000;
  display:flex; align-items:center; justify-content:space-between; padding:0 18px;
  background:var(--bg); border-bottom:1px solid var(--panel-border);
}
.nd-bar .title{font-weight:700; font-size:15px;}
.nd-open-tab{background:var(--panel); border:1px solid var(--panel-border); color:var(--text); border-radius:10px; padding:8px 14px; font-size:13px;}
</style>
</head>
<body data-view="home">

<!-- ================= HOME SCREEN ================= -->
<div class="view" id="view-home">
  <button id="settings-btn" title="Настройки">⚙</button>
  <div id="home-clock">--:--</div>
  <div id="home-battery">Заряд: -- %</div>
  <div id="home-title">Выбери режим</div>
  <div id="home-grid">
    <button class="app-tile tile-nav" data-goto="nav">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#3ea6ff" stroke-width="1.6"/><path d="M15.5 8.5L13 13L8.5 15.5L11 11L15.5 8.5Z" fill="#3ea6ff"/></svg>
      <div class="label">Навигация</div>
    </button>
    <button class="app-tile tile-spotify" data-goto="spotify">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" fill="#37d67a"/><path d="M7 10.5C10 9 15 9.3 17 11" stroke="#0e1712" stroke-width="1.6" stroke-linecap="round"/><path d="M7.5 13C10 11.8 14 12 16 13.5" stroke="#0e1712" stroke-width="1.6" stroke-linecap="round"/><path d="M8 15.3C10 14.4 13 14.6 14.7 15.7" stroke="#0e1712" stroke-width="1.6" stroke-linecap="round"/></svg>
      <div class="label">Spotify</div>
    </button>
    <button class="app-tile tile-both" data-goto="both">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="9.5" cy="12" r="6.5" stroke="#3ea6ff" stroke-width="1.6"/><circle cx="15" cy="12" r="6.5" stroke="#37d67a" stroke-width="1.6"/></svg>
      <div class="label">Оба сразу</div>
    </button>
    <button class="app-tile tile-ndgames" data-goto="ndgames">
      <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="8.5" width="18" height="9" rx="4" stroke="#ff5c7a" stroke-width="1.6"/><path d="M7.5 11v3.5M5.75 12.75h3.5" stroke="#ff5c7a" stroke-width="1.6" stroke-linecap="round"/><circle cx="16" cy="11.5" r="1" fill="#ff5c7a"/><circle cx="18" cy="13.5" r="1" fill="#ff5c7a"/></svg>
      <div class="label">ND Games</div>
    </button>
  </div>

  <div id="settings-overlay">
    <div id="settings-panel">
      <div class="settings-hdr"><span>Настройки</span><button id="settings-close">✕</button></div>
      <div class="settings-row-title">Тема карты</div>
      <div class="theme-opts">
        <button class="theme-opt" data-theme="auto">Авто (день/ночь)</button>
        <button class="theme-opt" data-theme="light">Светлая</button>
        <button class="theme-opt" data-theme="dark">Тёмная</button>
      </div>
      <div class="settings-hint">Авто: светлая с 7:00, тёмная с 19:00</div>
    </div>
  </div>
</div>

<!-- ================= NAV VIEW ================= -->
<div class="view" id="view-nav">
  <div id="map"></div>
  <div class="topbar">
    <button class="home-btn" data-goto="home">⌂</button>
    <div style="display:flex; gap:10px;">
      <div class="chip battery-chip" id="battery-chip-nav"><span class="dot"></span><span class="battery-text-nav">-- %</span></div>
      <div class="chip clock-chip" id="clock-nav">--:--</div>
    </div>
  </div>
  <div class="searchwrap" style="right:18px;">
    <input class="searchbox" id="searchbox-nav" type="text" placeholder="Куда едем?" autocomplete="off" />
  </div>
  <div class="results" id="results-nav" style="right:18px;"></div>
  <button class="traffic-btn" id="traffic-btn-nav">🚦</button>
  <button class="locate-btn" id="locate-btn-nav">◎</button>
  <div class="routebar" id="routebar-nav">
    <div><div class="big" id="route-eta-nav">--</div><div class="sub" id="route-dist-nav">-- км</div><div class="sub" id="route-compare-nav" style="opacity:0.7"></div></div>
    <div style="display:flex; gap:8px;">
      <button id="route-start-nav" class="start-btn">Поехали</button>
      <button id="route-cancel-nav">✕</button>
    </div>
  </div>
</div>

<!-- ================= SPOTIFY VIEW (fullscreen) ================= -->
<div class="view" id="view-spotify">
  <div class="topbar">
    <button class="home-btn" data-goto="home">⌂</button>
    <div class="chip clock-chip" id="clock-sp">--:--</div>
  </div>
  <div class="sp-now">
    <div class="thumb" id="sp-thumb-full">♪</div>
    <div class="meta">
      <div class="track" id="sp-track-full">Ничего не играет</div>
      <div class="artist" id="sp-artist-full">—</div>
    </div>
  </div>
  <div class="sp-controls">
    <button id="sp-prev-full">⏮</button>
    <button id="sp-play-full" class="play">▶</button>
    <button id="sp-next-full">⏭</button>
  </div>
  <div class="sp-grid-title">Плейлисты</div>
  <div class="sp-device" id="sp-device-full">Устройство: —</div>
  <div class="sp-grid" id="sp-grid-full"></div>
</div>

<!-- ================= BOTH VIEW ================= -->
<div class="view" id="view-both">
  <div id="map2"></div>
  <div class="topbar">
    <button class="home-btn" data-goto="home">⌂</button>
    <div style="display:flex; gap:10px;">
      <div class="chip battery-chip" id="battery-chip-both"><span class="dot"></span><span class="battery-text-both">-- %</span></div>
      <div class="chip clock-chip" id="clock-both">--:--</div>
    </div>
  </div>
  <div class="searchwrap" style="right:328px;">
    <input class="searchbox" id="searchbox-both" type="text" placeholder="Куда едем?" autocomplete="off" />
  </div>
  <div class="results" id="results-both" style="right:328px;"></div>
  <button class="traffic-btn" id="traffic-btn-both">🚦</button>
  <button class="locate-btn" id="locate-btn-both">◎</button>
  <div class="routebar" id="routebar-both">
    <div><div class="big" id="route-eta-both">--</div><div class="sub" id="route-dist-both">-- км</div><div class="sub" id="route-compare-both" style="opacity:0.7"></div></div>
    <div style="display:flex; gap:8px;">
      <button id="route-start-both" class="start-btn">Поехали</button>
      <button id="route-cancel-both">✕</button>
    </div>
  </div>

  <div id="music-dock">
    <div class="now-row">
      <div class="thumb" id="np-thumb-dock">♪</div>
      <div class="meta">
        <div class="track" id="sp-track-dock">Ничего не играет</div>
        <div class="artist" id="sp-artist-dock">—</div>
      </div>
    </div>
    <div class="controls">
      <button id="sp-prev-dock">⏮</button>
      <button id="sp-play-dock" class="play">▶</button>
      <button id="sp-next-dock">⏭</button>
      <button id="dock-playlists-btn">Плейлисты</button>
    </div>
  </div>
  <div id="dock-playlists">
    <div class="hdr"><span>Плейлисты</span><button class="close" id="dock-pl-close">Закрыть</button></div>
    <div class="sp-device" id="dock-pl-device">Устройство: —</div>
    <div id="dock-pl-list"></div>
  </div>
</div>

<!-- ================= ND GAMES VIEW ================= -->
<div class="view" id="view-ndgames">
  <div class="nd-bar">
    <button class="home-btn" data-goto="home">⌂</button>
    <div class="title">ND Games</div>
    <button class="nd-open-tab" id="nd-open-tab">Открыть в новой вкладке ↗</button>
  </div>
  <iframe id="ndgames-frame" src="about:blank" style="margin-top:64px;"></iframe>
</div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
