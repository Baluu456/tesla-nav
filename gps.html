<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Передача GPS</title>
<style>
  body{
    margin:0; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#0b0c0e; color:#eef1f4; font-family:-apple-system,'Segoe UI',Roboto,sans-serif; text-align:center; padding:24px;
  }
  .dot{width:14px; height:14px; border-radius:50%; background:#37d67a; margin-bottom:16px; animation:pulse 1.5s infinite;}
  .dot.off{background:#ff5c5c; animation:none;}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.3;}}
  .big{font-size:18px; font-weight:700; margin-bottom:6px;}
  .sub{color:#8b929c; font-size:14px;}
  .coords{margin-top:20px; font-size:13px; color:#8b929c; font-variant-numeric:tabular-nums;}
</style>
</head>
<body>
  <div class="dot" id="dot"></div>
  <div class="big" id="status">Запрашиваю доступ к геолокации…</div>
  <div class="sub">Держи эту вкладку открытой — она передаёт твои координаты в Tesla, пока свой GPS машины недоступен</div>
  <div class="coords" id="coords"></div>

<script>
const statusEl = document.getElementById('status');
const dotEl = document.getElementById('dot');
const coordsEl = document.getElementById('coords');

async function send(pos) {
  const { latitude, longitude, heading, speed } = pos.coords;
  try {
    await fetch('/api/gps', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lat: latitude, lon: longitude, heading, speed })
    });
    statusEl.textContent = 'Передаю координаты';
    dotEl.classList.remove('off');
    coordsEl.textContent = `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
  } catch (e) {
    statusEl.textContent = 'Нет связи с сервером';
    dotEl.classList.add('off');
  }
}

if ('geolocation' in navigator) {
  navigator.geolocation.watchPosition(send, err => {
    statusEl.textContent = 'Нет доступа к GPS телефона: ' + err.message;
    dotEl.classList.add('off');
  }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 });
} else {
  statusEl.textContent = 'Браузер не поддерживает геолокацию';
  dotEl.classList.add('off');
}

// не даём телефону уснуть и остановить передачу координат
if ('wakeLock' in navigator) {
  navigator.wakeLock.request('screen').catch(() => {});
}
</script>
</body>
</html>
