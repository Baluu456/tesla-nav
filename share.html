<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Отправка адреса в машину</title>
<style>
  body{
    margin:0; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#0b0c0e; color:#eef1f4; font-family:-apple-system,'Segoe UI',Roboto,sans-serif; text-align:center; padding:24px;
  }
  .big{font-size:22px; font-weight:700; margin-bottom:8px;}
  .sub{color:#8b929c; font-size:15px; max-width:280px;}
  .spinner{width:36px; height:36px; border:3px solid #262a30; border-top-color:#3ea6ff; border-radius:50%; animation:spin 0.8s linear infinite; margin-bottom:20px;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <div class="big" id="status">Отправляю в машину…</div>
  <div class="sub" id="sub">Адрес появится в навигации через пару секунд</div>

<script>
const params = new URLSearchParams(window.location.search);
const payload = {
  title: params.get('title') || '',
  text: params.get('text') || '',
  url: params.get('url') || ''
};

fetch('/api/destination', {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify(payload)
})
  .then(r => r.json())
  .then(data => {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('status').textContent = 'Готово!';
    document.getElementById('sub').textContent = data.parsed && data.parsed.query
      ? 'Адрес найден: ' + data.parsed.query
      : 'Координаты получены, можно закрыть';
    setTimeout(() => window.close(), 2000);
  })
  .catch(() => {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('status').textContent = 'Не получилось';
    document.getElementById('sub').textContent = 'Проверь, что телефон в сети';
  });
</script>
</body>
</html>
